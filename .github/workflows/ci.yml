name: MCP CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mcp*.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-mcp-dev.txt

      - name: Compile
        run: python -m compileall -q querygap_mcp tests/mcp

      - name: Unit tests
        run: python -m pytest -q tests/mcp

      - name: Whitespace check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git log -1 --check --pretty=medium
          fi

      - name: Build runtime image
        run: docker build --file Dockerfile.mcp --tag querygap-mcp-ci .
