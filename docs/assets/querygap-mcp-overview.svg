<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 720" role="img" aria-labelledby="title desc">
  <title id="title">Questions become a QueryGaP evidence record through ChatGPT or Claude</title>
  <desc id="desc">Loose scientific questions enter QueryGaP, which people can connect to through ChatGPT or Claude. The output resolves into a structured evidence record with exact study, dataset, variable, description, summary statistics, documentation metadata, and source links.</desc>

